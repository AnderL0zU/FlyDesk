<ion-content class="auth-contenido" [fullscreen]="true">
  <div class="auth-contenedor">
    <!-- Logo + nombre -->
    <div class="auth-marca">
      <img src="assets/img/Vector.svg" alt="" />
      <span>flydesk</span>
    </div>

    <h1 class="auth-titulo">Inicia sesión</h1>
    <p class="auth-subtitulo">Retoma tus vuelos de concentración donde los dejaste.</p>

    <!-- Formulario con ngModel (template-driven form) -->
    <form #formulario="ngForm" (ngSubmit)="iniciarSesion(formulario)" novalidate>
      <ion-input
        class="auth-campo"
        name="email"
        label="Correo o usuario"
        labelPlacement="floating"
        fill="outline"
        autocomplete="username"
        [(ngModel)]="credenciales.email"
        required
        errorText="Escribe tu correo o tu usuario"
      >
        <ion-icon slot="start" name="person-outline" aria-hidden="true"></ion-icon>
      </ion-input>

      <ion-input
        class="auth-campo"
        name="password"
        type="password"
        label="Contraseña"
        labelPlacement="floating"
        fill="outline"
        autocomplete="current-password"
        [(ngModel)]="credenciales.password"
        required
        errorText="Escribe tu contraseña"
      >
        <ion-icon slot="start" name="lock-closed-outline" aria-hidden="true"></ion-icon>
        <ion-input-password-toggle slot="end"></ion-input-password-toggle>
      </ion-input>

      <div class="opciones">
        <ion-checkbox name="recordar" [(ngModel)]="recordarCorreo" labelPlacement="end"> Recordarme </ion-checkbox>
      </div>

      <ion-button type="submit" expand="block" class="auth-boton" [disabled]="formulario.invalid">
        Iniciar sesión
      </ion-button>
    </form>

    <ion-text>
      <p class="auth-pie">
        ¿No tienes cuenta?
        <a routerLink="/registro">Crear cuenta</a>
      </p>
    </ion-text>

    <ion-note class="nota-demo">Cuenta de prueba: demo&#64;flydesk.com / 123456</ion-note>
  </div>
</ion-content>
