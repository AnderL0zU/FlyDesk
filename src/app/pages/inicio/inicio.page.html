<ion-content [fullscreen]="true" [scrollY]="false" class="contenido-inicio">
  <!-- Fotos de ciudades: todas apiladas, solo la activa es visible -->
  <div
    *ngFor="let imagen of imagenes; let i = index"
    class="fondo"
    [class.visible]="i === imagenActual"
    [style.background-image]="'url(' + imagen + ')'"
  ></div>
  <div class="degradado"></div>

  <div class="parte-inferior">
    <h1 class="titulo">¿Dónde empezará<br />tu viaje?</h1>

    <!-- hoja de busqueda (la peque;a minimizada)-->
    <button class="buscador-falso" type="button" (click)="abrirBuscador()">
      <ion-icon name="search-outline" aria-hidden="true"></ion-icon>
      <span *ngIf="!aeropuertoElegido">Selecciona tu aeropuerto</span>
      <span *ngIf="aeropuertoElegido" class="elegido">
        {{ aeropuertoElegido.nombre }}({{ aeropuertoElegido.iata }})
      </span>
    </button>
  </div>

  <!-- Hoja que sube desde abajo con el buscador -->
  <ion-modal
    class="hoja-busqueda"
    [isOpen]="buscadorAbierto"
    [initialBreakpoint]="0.55"
    [breakpoints]="[0, 0.55, 0.9]"
    [handle]="true"
    (didDismiss)="cerrarBuscador()"
  >
    <ng-template>
      <ion-content class="contenido-hoja">
        <ion-searchbar
          class="buscador"
          placeholder="Código del aeropuerto (ej. BOG)"
          [(ngModel)]="textoBusqueda"
          (ionInput)="buscar()"
          [debounce]="400"
          autocapitalize="characters"
          [maxlength]="3"
        ></ion-searchbar>
        <!-- el debounce espera 400ms para dejar que el usuario termine de escribir completo-->

        <ion-list class="lista-aeropuertos" *ngIf="!buscando">
          <!-- Lista completa resultados-->
          <ion-item *ngFor="let aeropuerto of resultados" button [detail]="false" (click)="elegir(aeropuerto)">
            <div class="icono-avion" slot="start">
              <ion-icon name="airplane" aria-hidden="true"></ion-icon>
            </div>
            <ion-label>{{ aeropuerto.nombre }}({{ aeropuerto.iata }})</ion-label>
          </ion-item>
        </ion-list>

        <div class="cargando" *ngIf="buscando">
          <ion-spinner name="crescent"></ion-spinner>
        </div>

        <ion-text *ngIf="!buscando && textoBusqueda.trim().length < 2" class="sin-resultados">
          <p>Escribe al menos 2 letras del código</p>
        </ion-text>

        <ion-text
          *ngIf="!buscando && textoBusqueda.trim().length >= 2 && resultados.length === 0"
          class="sin-resultados"
        >
          <p>No encontramos aeropuertos con "{{ textoBusqueda }}"</p>
        </ion-text>
      </ion-content>
    </ng-template>
  </ion-modal>
</ion-content>
