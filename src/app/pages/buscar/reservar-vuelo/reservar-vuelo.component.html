<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Pase de abordar</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cerrar()">
        <ion-icon slot="icon-only" name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <!-- Vista previa de la ruta en el globo 3D -->
  <div class="zona-globo">
    <app-globo [origen]="vuelo.origen" [destino]="vuelo.destino" [progreso]="0" [altura]="230"></app-globo>
  </div>

  <div class="ion-padding">
    <app-pase-abordar
      [vuelo]="vuelo"
      [pasajero]="usuario?.nombre || ''"
      [etiqueta]="etiqueta"
      [clima]="clima"
      [cargandoClima]="cargandoClima"
    ></app-pase-abordar>
  </div>

  <!-- En que se va a concentrar -->
  <ion-list inset="true">
    <ion-list-header>
      <ion-label>¿En qué te vas a enfocar?</ion-label>
    </ion-list-header>
    <ion-radio-group [(ngModel)]="etiqueta" name="etiqueta">
      <ion-item *ngFor="let opcion of etiquetas">
        <ion-icon slot="start" [name]="opcion.icono" color="primary"></ion-icon>
        <ion-radio [value]="opcion.valor">{{ opcion.valor }}</ion-radio>
      </ion-item>
    </ion-radio-group>
  </ion-list>

  <ion-list inset="true">
    <ion-item>
      <ion-textarea
        label="Nota (opcional)"
        labelPlacement="stacked"
        placeholder="Ej: Terminar el taller de Capacitor"
        [(ngModel)]="nota"
        [autoGrow]="true"
        [counter]="true"
        maxlength="120"
      ></ion-textarea>
    </ion-item>
  </ion-list>

  <ion-note class="aviso" *ngIf="usuario?.ajustes?.modoEstricto">
    <ion-icon name="lock-closed-outline"></ion-icon>
    Modo estricto activo: si sales de la app tu vuelo será desviado.
  </ion-note>
</ion-content>

<ion-footer class="ion-padding">
  <ion-button expand="block" shape="round" color="secondary" (click)="despegar()">
    <ion-icon slot="start" name="rocket-outline"></ion-icon>
    Despegar · {{ vuelo.origen.iata }} → {{ vuelo.destino.iata }}
  </ion-button>
</ion-footer>
