<ion-header class="ion-no-border">
  <ion-toolbar class="barra">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login" text="" class="boton-atras"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="auth-contenido">
  <div class="auth-contenedor">
    <div class="auth-marca">
      <img src="assets/img/Vector.svg" alt="" />
      <span>flydesk</span>
    </div>

    <h1 class="auth-titulo">Crea tu cuenta</h1>
    <p class="auth-subtitulo">Tu pasaporte para guardar cada vuelo de concentración.</p>

    <form (ngSubmit)="crearCuenta()" novalidate>
      <!-- Username -->
      <ion-input
        class="auth-campo"
        [class.campo-invalido]="mostrarError('username')"
        name="username"
        label="Nombre de usuario"
        labelPlacement="floating"
        fill="outline"
        autocomplete="username"
        autocapitalize="off"
        [(ngModel)]="datos.username"
        (ionBlur)="marcarTocado('username')"
        [counter]="true"
        maxlength="20"
      >
        <ion-icon slot="start" name="person-outline" aria-hidden="true"></ion-icon>
      </ion-input>
      <ion-text color="danger" class="auth-error" *ngIf="mostrarError('username')">
        {{ mostrarError('username') }}
      </ion-text>

      <!-- Email -->
      <ion-input
        class="auth-campo"
        [class.campo-invalido]="mostrarError('email')"
        name="email"
        type="email"
        inputmode="email"
        label="Correo electrónico"
        labelPlacement="floating"
        fill="outline"
        autocomplete="email"
        [(ngModel)]="datos.email"
        (ionBlur)="marcarTocado('email')"
      >
        <ion-icon slot="start" name="at-outline" aria-hidden="true"></ion-icon>
      </ion-input>
      <ion-text color="danger" class="auth-error" *ngIf="mostrarError('email')">
        {{ mostrarError('email') }}
      </ion-text>

      <!-- Edad -->
      <ion-input
        class="auth-campo"
        [class.campo-invalido]="mostrarError('edad')"
        name="edad"
        type="number"
        inputmode="numeric"
        label="Edad"
        labelPlacement="floating"
        fill="outline"
        min="13"
        max="100"
        [(ngModel)]="datos.edad"
        (ionBlur)="marcarTocado('edad')"
      >
        <ion-icon slot="start" name="calendar-outline" aria-hidden="true"></ion-icon>
      </ion-input>
      <ion-text color="danger" class="auth-error" *ngIf="mostrarError('edad')">
        {{ mostrarError('edad') }}
      </ion-text>

      <!-- Contraseña -->
      <ion-input
        class="auth-campo"
        [class.campo-invalido]="mostrarError('password')"
        name="password"
        type="password"
        label="Contraseña"
        labelPlacement="floating"
        fill="outline"
        autocomplete="new-password"
        [(ngModel)]="datos.password"
        (ionBlur)="marcarTocado('password')"
      >
        <ion-icon slot="start" name="lock-closed-outline" aria-hidden="true"></ion-icon>
        <ion-input-password-toggle slot="end"></ion-input-password-toggle>
      </ion-input>

      <ion-button type="submit" expand="block" class="auth-boton">Crear cuenta</ion-button>
    </form>

    <ion-text>
      <p class="auth-pie">
        ¿Ya tienes cuenta?
        <a routerLink="/login">Inicia sesión</a>
      </p>
    </ion-text>
  </div>
</ion-content>
