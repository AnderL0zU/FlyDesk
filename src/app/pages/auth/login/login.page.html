<ion-content class="fondo-cielo" [fullscreen]="true">
  <div class="contenedor">
    <!-- Logo -->
    <div class="logo">
      <div class="logo-circulo">
        <ion-icon name="airplane"></ion-icon>
      </div>
      <h1>FlyDesk</h1>
      <p>Cada sesión de foco es un vuelo</p>
    </div>

    <!-- Formulario con ngModel (template-driven form) -->
    <form #formulario="ngForm" (ngSubmit)="iniciarSesion(formulario)" class="tarjeta-form">
      <ion-input
        name="email"
        type="email"
        label="Correo electrónico"
        labelPlacement="floating"
        fill="outline"
        placeholder="tu@correo.com"
        [(ngModel)]="credenciales.email"
        required
        email
        errorText="Escribe un correo válido"
      >
        <ion-icon slot="start" name="mail-outline"></ion-icon>
      </ion-input>

      <ion-input
        name="password"
        type="password"
        label="Contraseña"
        labelPlacement="floating"
        fill="outline"
        [(ngModel)]="credenciales.password"
        required
        minlength="6"
        errorText="Mínimo 6 caracteres"
      >
        <ion-icon slot="start" name="lock-closed-outline"></ion-icon>
        <ion-input-password-toggle slot="end"></ion-input-password-toggle>
      </ion-input>

      <ion-checkbox name="recordar" [(ngModel)]="recordarCorreo" labelPlacement="end">
        Recordar mi correo
      </ion-checkbox>

      <ion-button type="submit" expand="block" shape="round" [disabled]="formulario.invalid">
        <ion-icon slot="start" name="log-in-outline"></ion-icon>
        Iniciar sesión
      </ion-button>
    </form>

    <ion-text class="ion-text-center">
      <p>
        ¿No tienes cuenta?
        <a routerLink="/registro">Regístrate aquí</a>
      </p>
    </ion-text>

    <ion-note class="ion-text-center nota-demo">
      Cuenta de prueba: demo&#64;flydesk.com / 123456
    </ion-note>
  </div>
</ion-content>
