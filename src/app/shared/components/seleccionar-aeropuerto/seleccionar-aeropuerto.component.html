<ion-header>
  <ion-toolbar color="primary">
    <ion-title>{{ titulo }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cerrar()">
        <ion-icon slot="icon-only" name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
  <ion-toolbar color="primary">
    <ion-searchbar
      [(ngModel)]="textoBusqueda"
      (ionInput)="filtrar()"
      placeholder="Ciudad, país o código (BOG)"
      [debounce]="250"
      animated="true"
    ></ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="acciones ion-padding-horizontal ion-padding-top">
    <ion-button expand="block" fill="outline" (click)="usarMiUbicacion()" [disabled]="buscandoUbicacion">
      <ion-spinner *ngIf="buscandoUbicacion" name="crescent" slot="start"></ion-spinner>
      <ion-icon *ngIf="!buscandoUbicacion" slot="start" name="locate-outline"></ion-icon>
      Usar mi ubicación (aeropuerto más cercano)
    </ion-button>
    <ion-button *ngIf="permitirCualquiera" expand="block" fill="clear" (click)="elegirCualquiera()">
      Cualquier aeropuerto
    </ion-button>
  </div>

  <!-- Lista agrupada por continente -->
  <ion-item-group *ngFor="let grupo of grupos">
    <ion-item-divider sticky="true" color="light">
      <ion-label>{{ grupo.continente }}</ion-label>
      <ion-note slot="end" class="ion-padding-end">{{ grupo.aeropuertos.length }}</ion-note>
    </ion-item-divider>

    <ion-item
      *ngFor="let aeropuerto of grupo.aeropuertos; trackBy: trackPorCodigo"
      button
      [detail]="false"
      (click)="elegir(aeropuerto)"
    >
      <div slot="start" class="iata">{{ aeropuerto.iata }}</div>
      <ion-label>
        <h3>{{ aeropuerto.ciudad }}, {{ aeropuerto.pais }}</h3>
        <p>{{ aeropuerto.nombre }}</p>
      </ion-label>
      <ion-icon *ngIf="aeropuerto.iata === seleccionado" slot="end" name="checkmark-circle" color="success"></ion-icon>
    </ion-item>
  </ion-item-group>

  <ion-text color="medium" *ngIf="grupos.length === 0">
    <p class="ion-text-center ion-padding">No encontramos aeropuertos con "{{ textoBusqueda }}"</p>
  </ion-text>
</ion-content>
