<ion-content [fullscreen]="true" [scrollY]="false" class="contenido-vuelo">
  <ng-container *ngIf="enCurso">
    <!-- Globo en toda la pantalla -->
    <app-globo
      [origen]="enCurso.vuelo.origen"
      [destino]="enCurso.vuelo.destino"
      [progreso]="progresoGlobo"
      [altura]="alturaGlobo"
      [seguirAvion]="true"
      [pausado]="enCurso.pausado"
    ></app-globo>

    <!-- Botones de arriba -->
    <div class="arriba">
      <ion-button class="boton-negro" (click)="abortar()">
        <ion-icon slot="start" name="close-circle-outline"></ion-icon>
        Abortar
      </ion-button>

      <ion-button
        class="boton-negro boton-redondo"
        [attr.aria-label]="enCurso.pausado ? 'Continuar vuelo' : 'Pausar vuelo'"
        (click)="enCurso.pausado ? continuar() : pausar()"
      >
        <ion-icon slot="icon-only" [name]="enCurso.pausado ? 'play' : 'pause'"></ion-icon>
      </ion-button>
    </div>

    <!-- Tarjeta con la informacion del vuelo -->
    <div class="abajo">
      <!-- Solo para pruebas: termina el vuelo al instante -->
      <ion-button size="small" fill="clear" class="boton-prueba" (click)="terminarRapido()">
        Terminar vuelo (prueba)
      </ion-button>

      <div class="tarjeta">
        <div class="codigo">
          <span class="icono-codigo">
            <ion-icon name="airplane" aria-hidden="true"></ion-icon>
          </span>
          {{ enCurso.codigo }}
        </div>

        <ion-grid class="ion-no-padding">
          <ion-row>
            <ion-col size="6">
              <p class="etiqueta">Salida</p>
              <p class="ciudad">{{ enCurso.vuelo.origen.ciudad }}</p>
            </ion-col>
            <ion-col size="6" class="ion-text-end">
              <p class="etiqueta">Llegada</p>
              <p class="ciudad">{{ enCurso.vuelo.destino.ciudad }}</p>
            </ion-col>
          </ion-row>

          <ion-row class="ion-align-items-end">
            <ion-col size="auto">
              <span class="iata">{{ enCurso.vuelo.origen.iata }}</span>
            </ion-col>
            <ion-col class="centro">
              <span class="pastilla">
                {{ enCurso.pausado ? 'En pausa' : 'Quedan ' + tiempoRestante }}
              </span>
              <ion-progress-bar class="barra-progreso" [value]="progresoBarra"></ion-progress-bar>
            </ion-col>
            <ion-col size="auto" class="ion-text-end">
              <span class="iata">{{ enCurso.vuelo.destino.iata }}</span>
            </ion-col>
          </ion-row>
        </ion-grid>
      </div>
    </div>
  </ng-container>
</ion-content>
